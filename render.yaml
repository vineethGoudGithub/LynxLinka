# Render Deployment Blueprint for LynxLink
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ── LynxLink Spring Boot Backend (Docker Web Service) ───────────────────────
  - type: web
    name: lynxlink-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:postgresql://ep-sweet-dream-b5w1ctab-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_GY0Xaid3MZWm
      - key: APP_BASE_URL
        value: https://lynxlink-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://lynxlink-frontend.onrender.com,https://lynxlink.vercel.app
      - key: JWT_SECRET
        generateValue: true

  # ── LynxLink React Frontend (Static Site) ──────────────────────────────────
  - type: web
    name: lynxlink-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://lynxlink-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
